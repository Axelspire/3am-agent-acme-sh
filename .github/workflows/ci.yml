name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install -q pytest
      - name: shellcheck
        run: shellcheck -S warning -x install-lib.sh install.sh scripts/*.sh
      - name: unit tests
        run: python3 -m pytest tests/unit --confcutdir=tests/unit -v

      - name: Smoke upload-artifact@v7
        run: |
          mkdir -p /tmp/v7-smoke
          echo "ok" > /tmp/v7-smoke/ok.txt
      - uses: actions/upload-artifact@v7
        with:
          name: actions-v7-smoke
          path: /tmp/v7-smoke/ok.txt
          retention-days: 1
