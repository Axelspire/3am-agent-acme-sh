# Temporary smoke: prove actions/upload-artifact@v7 on runners.
# Safe to delete after Dependabot v7 verification.
name: actions-v7-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Write tiny artifact
        run: |
          mkdir -p /tmp/v7-smoke
          echo "actions-v7-smoke ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/v7-smoke/ok.txt
          python3 --version
      - uses: actions/upload-artifact@v7
        with:
          name: actions-v7-smoke
          path: /tmp/v7-smoke/ok.txt
          retention-days: 1
