#
# Phase B: promote a frozen A2 candidate prerelease into draft PRs for
# agent-repo main (if needed), 3am-core publish tree, and fleet pin.
# Does not apply customer-deploy.
#
# CORE-65: after merging agent metadata, create annotated git tag <pin>
# (same string as upstream acme.sh). Fleet agents.acme.sh.module := pin.

name: publish-pin

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate prerelease tag (e.g. candidate-pin-3.1.2)
        required: true
        type: string

# Optional environment with required reviewers — create "agent-pin-publish"
# in repo Settings → Environments. If missing, job still runs (no gate).
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: agent-pin-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Require PUBLISH_PAT for cross-repo PRs
        env:
          PUBLISH_PAT: ${{ secrets.PUBLISH_PAT }}
        run: |
          if [ -z "${PUBLISH_PAT}" ]; then
            echo "::error::Set repo secret PUBLISH_PAT (fine-grained PAT with contents+PRs on 3am-core and 3am-deployments)."
            exit 1
          fi

      - name: Download candidate release (frozen bytes)
        id: cand
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          # gh release download flattens nested asset paths (archive/, tags/, companion/).
          # Prefer candidate-layout.tar.gz when present; else reconstruct from flat names.
          mkdir -p /tmp/candidate-dl /tmp/candidate
          if gh release download "${TAG}" -R "${{ github.repository }}" \
               -p 'candidate-layout.tar.gz' -D /tmp/candidate-dl \
             && [ -f /tmp/candidate-dl/candidate-layout.tar.gz ]; then
            tar -xzf /tmp/candidate-dl/candidate-layout.tar.gz -C /tmp/candidate
          else
            gh release download "${TAG}" -R "${{ github.repository }}" -D /tmp/candidate-dl
            PIN=$(tr -d '[:space:]' < /tmp/candidate-dl/UPSTREAM_PIN.txt)
            mkdir -p /tmp/candidate/archive /tmp/candidate/tags \
              /tmp/candidate/companion/deploy
            for f in install.sh INSTALL.md pin MODULE manifest.json \
              ARCHIVE_SHA256.txt CANDIDATE_TAG.txt UPSTREAM_PIN.txt; do
              [ -f "/tmp/candidate-dl/${f}" ] && cp -f "/tmp/candidate-dl/${f}" "/tmp/candidate/${f}"
            done
            cp -f "/tmp/candidate-dl/${PIN}.tar.gz" "/tmp/candidate/archive/${PIN}.tar.gz"
            cp -f "/tmp/candidate-dl/${PIN}" "/tmp/candidate/tags/${PIN}"
            [ -f /tmp/candidate-dl/3am-scan.sh ] && \
              cp -f /tmp/candidate-dl/3am-scan.sh /tmp/candidate/companion/3am-scan.sh
            [ -f /tmp/candidate-dl/VERSION ] && \
              cp -f /tmp/candidate-dl/VERSION /tmp/candidate/companion/VERSION
            [ -f /tmp/candidate-dl/3am_scan.sh ] && \
              cp -f /tmp/candidate-dl/3am_scan.sh /tmp/candidate/companion/deploy/3am_scan.sh
          fi
          PIN=$(tr -d '[:space:]' < /tmp/candidate/UPSTREAM_PIN.txt)
          DIGEST=$(tr -d '[:space:]' < /tmp/candidate/ARCHIVE_SHA256.txt)
          MODULE=$(tr -d '[:space:]' < /tmp/candidate/MODULE)
          # CORE-65: MODULE must equal pin (transitional fleet field).
          if [ "${MODULE}" != "${PIN}" ]; then
            echo "::warning::candidate MODULE (${MODULE}) != pin (${PIN}); forcing MODULE=pin"
            printf '%s\n' "${PIN}" > /tmp/candidate/MODULE
            MODULE="${PIN}"
          fi
          GOT=$(sha256sum "/tmp/candidate/archive/${PIN}.tar.gz" | awk '{print $1}')
          [ "${GOT}" = "${DIGEST}" ] || {
            echo "::error::candidate archive digest mismatch"
            exit 1
          }
          echo "pin=${PIN}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "module=${MODULE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -la /tmp/candidate /tmp/candidate/archive /tmp/candidate/tags /tmp/candidate/companion

      - name: Merge agent metadata PR / land on main
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.cand.outputs.pin }}
          TAG: ${{ steps.cand.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          branch="pin/${PIN}"
          git fetch origin main
          git checkout -B "${branch}" origin/main
          cp -f /tmp/candidate/pin pin
          cp -f /tmp/candidate/manifest.json manifest.json
          cp -f /tmp/candidate/MODULE MODULE
          mkdir -p tags
          cp -f "/tmp/candidate/tags/${PIN}" "tags/${PIN}"
          git add pin "tags/${PIN}" manifest.json MODULE
          if ! git diff --cached --quiet; then
            git commit -m "CORE-65: vendor upstream acme.sh pin ${PIN} (publish ${TAG})"
            git push -u origin "${branch}" --force
          fi
          # Open or update PR and merge
          existing=$(gh pr list --head "${branch}" --json number,state --jq '.[0].number // empty')
          if [ -z "${existing}" ]; then
            gh pr create --base main --head "${branch}" \
              --title "CORE-65: vendor upstream acme.sh pin ${PIN}" \
              --body "Promoted from candidate \`${TAG}\` by **publish-pin**. Git tag will be \`${PIN}\`."
            existing=$(gh pr list --head "${branch}" --json number --jq '.[0].number')
          else
            gh pr ready "${existing}" || true
          fi
          gh pr merge "${existing}" --squash --delete-branch || {
            echo "::warning::Could not auto-merge agent PR #${existing}; merge manually then re-run for tag/core/fleet."
          }

      - name: Tag repo x.y.z (== pin / upstream)
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.cand.outputs.pin }}
          TAG: ${{ steps.cand.outputs.tag }}
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git checkout main
          git pull origin main
          # Annotated release tag mirrors upstream acme.sh (CORE-65 acceptance).
          if git rev-parse -q --verify "refs/tags/${PIN}" >/dev/null; then
            echo "::warning::tag ${PIN} already exists — leaving in place"
          else
            git tag -a "${PIN}" -m "Release pin ${PIN} (upstream acme.sh ${PIN}; from ${TAG}; sha256 ${DIGEST})"
            git push origin "${PIN}"
            echo "Created git tag ${PIN}"
          fi
          # Optional GitHub Release (non-prerelease) pointing at the pin tag.
          if ! gh release view "${PIN}" >/dev/null 2>&1; then
            gh release create "${PIN}" \
              --title "${PIN}" \
              --notes "Customer-facing pin **${PIN}**.

          \`\`\`
          git tag == pin == archive/${PIN}.tar.gz == tags/${PIN} == fleet pin
          \`\`\`

          Promoted from candidate \`${TAG}\`. GPL archive digest: \`${DIGEST}\`.
          Wrapper/companion stay outside the tarball."
          fi

      - name: Open draft PR on 3am-core
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_PAT }}
          PIN: ${{ steps.cand.outputs.pin }}
          TAG: ${{ steps.cand.outputs.tag }}
          DIGEST: ${{ steps.cand.outputs.digest }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Axelspire/3am-core.git" /tmp/3am-core
          cd /tmp/3am-core
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "agent/acme-sh-pin-${PIN}" origin/main
          mkdir -p deploy/agents/acmesh/archive deploy/agents/acmesh/tags
          cp -f /tmp/candidate/pin deploy/agents/acmesh/pin
          cp -f /tmp/candidate/MODULE deploy/agents/acmesh/MODULE
          cp -f /tmp/candidate/manifest.json deploy/agents/acmesh/manifest.json
          cp -f "/tmp/candidate/tags/${PIN}" "deploy/agents/acmesh/tags/${PIN}"
          cp -f "/tmp/candidate/archive/${PIN}.tar.gz" "deploy/agents/acmesh/archive/${PIN}.tar.gz"
          git add \
            deploy/agents/acmesh/pin \
            deploy/agents/acmesh/MODULE \
            deploy/agents/acmesh/manifest.json \
            "deploy/agents/acmesh/tags/${PIN}" \
            "deploy/agents/acmesh/archive/${PIN}.tar.gz"
          if git diff --cached --quiet; then
            echo "Core publish tree already has pin ${PIN} (digest ${DIGEST})"
            echo "CORE_PR=(already on main)" >> "$GITHUB_ENV"
          else
            git commit -m "CORE-65: publish acme.sh pin ${PIN} (module==pin)"
            git push -u origin "agent/acme-sh-pin-${PIN}" --force
            body="Synced from \`${TAG}\` via **publish-pin** (frozen digest \`${DIGEST}\`).

          CORE-65: \`MODULE\` == pin **${PIN}** (no separate v0.x.y).
          Pair with fleet \`agents.acme.sh.pin: \"${PIN}\"\` (and module == pin) then customer-deploy apply."
            existing=$(gh pr list -R Axelspire/3am-core --head "agent/acme-sh-pin-${PIN}" --json number --jq '.[0].number // empty')
            if [ -n "${existing}" ]; then
              gh pr edit -R Axelspire/3am-core "${existing}" --title "CORE-65: publish acme.sh pin ${PIN}" --body "${body}"
              gh pr ready -R Axelspire/3am-core "${existing}" --undo || true
            else
              gh pr create -R Axelspire/3am-core --draft --base main --head "agent/acme-sh-pin-${PIN}" \
                --title "CORE-65: publish acme.sh pin ${PIN}" \
                --body "${body}"
            fi
            echo "CORE_PR=$(gh pr list -R Axelspire/3am-core --head "agent/acme-sh-pin-${PIN}" --json url --jq '.[0].url')" >> "$GITHUB_ENV"
          fi

      - name: Open draft PR on 3am-deployments (fleet pin)
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_PAT }}
          PIN: ${{ steps.cand.outputs.pin }}
          MODULE: ${{ steps.cand.outputs.module }}
          TAG: ${{ steps.cand.outputs.tag }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Axelspire/3am-deployments.git" /tmp/3am-deployments
          cd /tmp/3am-deployments
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "agents/acme-sh-pin-${PIN}" origin/main
          PIN="${PIN}" MODULE="${MODULE}" python3 <<'PY'
          from pathlib import Path
          import os
          pin = os.environ["PIN"]
          module = os.environ["MODULE"]  # CORE-65: == pin
          p = Path("_common/fleet-baseline.yaml")
          lines = p.read_text().splitlines()
          out = []
          in_acme = False
          for line in lines:
              if line.strip() == "acme.sh:":
                  in_acme = True
              elif in_acme and line[:2] == "  " and line[2:3] != " " and line.strip().endswith(":"):
                  in_acme = False
              if in_acme and line.startswith("    pin:"):
                  line = f'    pin: "{pin}"'
              elif in_acme and line.startswith("    module:"):
                  # Keep module key for SPA/TF bake; value collapses to pin.
                  line = f'    module: "{module}"'
              out.append(line)
          p.write_text("\n".join(out) + "\n")
          print(p.read_text())
          PY
          git add _common/fleet-baseline.yaml
          if git diff --cached --quiet; then
            echo "Fleet pin already ${PIN}"
          else
            git commit -m "CORE-65: fleet agents.acme.sh pin/module ${PIN}"
            git push -u origin "agents/acme-sh-pin-${PIN}" --force
            body="Fleet pin **${PIN}** with \`module: \"${MODULE}\"` (== pin, CORE-65) from candidate \`${TAG}\`.

          Merge after core publish PR; then customer-deploy apply."
            existing=$(gh pr list -R Axelspire/3am-deployments --head "agents/acme-sh-pin-${PIN}" --json number --jq '.[0].number // empty')
            if [ -n "${existing}" ]; then
              gh pr edit -R Axelspire/3am-deployments "${existing}" --title "CORE-65: fleet acme.sh pin ${PIN}" --body "${body}"
              gh pr ready -R Axelspire/3am-deployments "${existing}" --undo || true
            else
              gh pr create -R Axelspire/3am-deployments --draft --base main --head "agents/acme-sh-pin-${PIN}" \
                --title "CORE-65: fleet acme.sh pin ${PIN}" \
                --body "${body}"
            fi
          fi
          echo "FLEET_PR=$(gh pr list -R Axelspire/3am-deployments --head "agents/acme-sh-pin-${PIN}" --json url --jq '.[0].url')" >> "$GITHUB_ENV"

      - name: Summary
        env:
          PIN: ${{ steps.cand.outputs.pin }}
          TAG: ${{ steps.cand.outputs.tag }}
        run: |
          {
            echo "## publish-pin complete (CORE-65)"
            echo "- candidate: \`${TAG}\`"
            echo "- git tag / pin: \`${PIN}\`"
            echo "- core PR: ${CORE_PR:-"(see job log)"}"
            echo "- fleet PR: ${FLEET_PR:-"(see job log)"}"
            echo ""
            echo "Merge order: agent (if open) → core (+ modules.core if required) → fleet → customer-deploy apply → ops one-curl."
          } >> "$GITHUB_STEP_SUMMARY"
